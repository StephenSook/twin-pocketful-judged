<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pocketful</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/Figtree.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/static/fonts/BricolageGrotesque.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Pocketful home">
      <img class="brand-mark" src="/static/mark.svg" alt="" width="36" height="36">
      <span class="brand-word">Pocketful</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="main" class="page" tabindex="-1">
  <div class="boot" aria-busy="true">
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-row"></div>
    <div class="skeleton skeleton-row"></div>
  </div>
  <noscript><p class="notice">Pocketful needs JavaScript to show your wallet.</p></noscript>
</main>
<footer class="footer">
  <div class="footer-inner">
    <p class="footer-brand">Pocketful</p>
    <p class="footer-text">Send, request, split and hold money with the people you know. Amounts are exact to the smallest unit of your currency.</p>
    <p class="footer-small">Illustrations supplied by the product owner. Fonts: Bricolage Grotesque, Figtree and Caveat under the SIL Open Font License.</p>
  </div>
</footer>

</html>
